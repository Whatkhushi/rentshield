# Run the whole app locally with one command:
#   docker compose up --build
# Then open http://localhost:8080 (demo logins are on the login page).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rentshield
      POSTGRES_PASSWORD: rentshield
      POSTGRES_DB: rentshield
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rentshield -d rentshield']
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://rentshield:rentshield@db:5432/rentshield
      JWT_SECRET: local-docker-secret-change-me
      APP_URL: http://localhost:8080
      SEED_DEMO: 'true'
    ports:
      - '8080:4100'
    volumes:
      - uploads:/app/storage # photos and PDFs survive container restarts
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
